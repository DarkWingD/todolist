# Rate-limit sign-in by the real client IP (Cloudflare provides CF-Connecting-IP).
limit_req_zone $http_cf_connecting_ip zone=signin:10m rate=5r/m;

# The old address keeps working: everything on it is sent to the new one.
server {
  listen 80;
  server_name todolist.dansownsite.com;
  return 301 https://sorted.dansownsite.com$request_uri;
}

server {
  listen 80 default_server;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # nginx only resolves a hostname given to proxy_pass as a literal string once, at startup —
  # so when docker compose recreates the api container (any deploy that touches it) with a new
  # internal IP, this one keeps proxying to the old, now-dead address until nginx itself is
  # restarted. 127.0.0.11 is Docker's own embedded DNS for this network; naming it with a
  # resolver, and giving proxy_pass a variable instead of a literal, makes nginx re-resolve
  # "api" on every request rather than caching it for the container's whole lifetime. Found
  # 2026-10-26: a routine deploy left sign-in 502ing until someone noticed and restarted this
  # container by hand.
  resolver 127.0.0.11 valid=10s;
  set $api_upstream http://api:8787;

  # ── Security headers (apply to every response; locations below avoid their own
  # add_header so these are inherited) ──
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; manifest-src 'self'; worker-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

  # Return 429 (not the default 503) when rate-limited.
  limit_req_status 429;

  # Stricter rate limit on the magic-link sign-in (prevents email-bombing an address).
  location /api/auth/sign-in/ {
    limit_req zone=signin burst=3 nodelay;
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Proxy API + auth to the api service.
  location /api/ {
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }

  # Don't cache the service worker or index (use `expires`, not add_header, so the
  # security headers above are still inherited).
  location = /sw.js { expires -1; }
  location = /index.html { expires -1; }

  # Hashed assets can be cached hard.
  location /assets/ { expires 1y; }

  # SPA fallback.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
