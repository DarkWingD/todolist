# Rate-limit sign-in by the real client IP (Cloudflare provides CF-Connecting-IP).
limit_req_zone $http_cf_connecting_ip zone=signin:10m rate=5r/m;

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # ── Security headers (apply to every response; locations below avoid their own
  # add_header so these are inherited) ──
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; manifest-src 'self'; worker-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

  # Return 429 (not the default 503) when rate-limited.
  limit_req_status 429;

  # Stricter rate limit on the magic-link sign-in (prevents email-bombing an address).
  location /api/auth/sign-in/ {
    limit_req zone=signin burst=3 nodelay;
    proxy_pass http://api:8787;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Proxy API + auth to the api service.
  location /api/ {
    proxy_pass http://api:8787;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }

  # Don't cache the service worker or index (use `expires`, not add_header, so the
  # security headers above are still inherited).
  location = /sw.js { expires -1; }
  location = /index.html { expires -1; }

  # Hashed assets can be cached hard.
  location /assets/ { expires 1y; }

  # SPA fallback.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
